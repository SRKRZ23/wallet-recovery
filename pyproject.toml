[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "walletrecover"
version = "0.1.0"
description = "Authorized, owner-run crypto wallet recovery — rebuild access to a wallet you own from what you remember."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sardor Razikov" }]
requires-python = ">=3.9"
keywords = ["bitcoin", "wallet", "recovery", "secp256k1", "ecdsa", "brainwallet", "crypto", "seed"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Intended Audience :: End Users/Desktop",
]
dependencies = ["ecdsa>=0.18", "base58>=2.1"]

[project.optional-dependencies]
fast = ["coincurve>=18"]
bip39 = ["bip-utils>=2.7"]

[project.urls]
Homepage = "https://github.com/SRKRZ23/wallet-recovery"
Explainer = "https://how-bitcoin-crypto-works.netlify.app"

[project.scripts]
walletrecover = "walletrecover.recover:main"

[tool.setuptools]
packages = ["walletrecover"]
